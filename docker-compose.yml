    volumes:
      - attachment_data:/app/data/attachments
      - rag_data:/app/data/rag
      - whisper_models:/models/whisper
    depends_on:
      api:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      whisper-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-rag:
    extends:
      service: worker
    environment:
      WORKER_QUEUE: rag
      WORKER_RUN_SCHEDULER: "false"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
        VITE_APP_RELEASE: ${APP_RELEASE:-local}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  attachment_data:
  rag_data:
  ollama_data:
  whisper_models:
