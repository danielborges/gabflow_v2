services:
  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  parser-init:
    build:
      context: ./backend
    user: root
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /run/gabflow-parser && chown gabflow:gabflow /run/gabflow-parser"]
    volumes:
      - parser_socket:/run/gabflow-parser
    restart: "no"

  parser:
    build:
      context: ./backend
    user: gabflow
    network_mode: none
    entrypoint: ["/app/parser-entrypoint.sh"]
    environment:
      DOCUMENT_PARSER_SOCKET_PATH: /run/gabflow-parser/parser.sock
      PARSER_ALLOWED_ROOTS: /app/data/attachments:/app/data/rag
      PARSER_TIMEOUT_SECONDS: ${DOCUMENT_PARSER_TIMEOUT_SECONDS:-120}
      PARSER_MAX_RESPONSE_BYTES: ${DOCUMENT_PARSER_MAX_RESPONSE_BYTES:-10485760}
      PARSER_MAX_FILE_BYTES: ${PARSER_MAX_FILE_BYTES:-31457280}
      PARSER_MAX_OUTPUT_CHARS: ${PARSER_MAX_OUTPUT_CHARS:-5000000}
      PARSER_PROCESS_MEMORY_BYTES: ${PARSER_PROCESS_MEMORY_BYTES:-536870912}
      PARSER_MAX_WORKERS: ${PARSER_MAX_WORKERS:-4}
      DOCUMENT_OCR_MODEL: ${DOCUMENT_OCR_MODEL:-tesseract-5}
      DOCUMENT_OCR_LANGUAGE: ${DOCUMENT_OCR_LANGUAGE:-por}
      DOCUMENT_OCR_MAX_PAGES: ${DOCUMENT_OCR_MAX_PAGES:-500}
      DOCUMENT_OCR_MAX_PIXELS: ${DOCUMENT_OCR_MAX_PIXELS:-25000000}
      DOCUMENT_OCR_NATIVE_MIN_CHARS: ${DOCUMENT_OCR_NATIVE_MIN_CHARS:-40}
      DOCUMENT_OCR_BATCH_SIZE: ${DOCUMENT_OCR_BATCH_SIZE:-8}
    volumes:
      - attachment_data:/app/data/attachments:ro
      - rag_data:/app/data/rag:ro
      - parser_socket:/run/gabflow-parser
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 768m
    cpus: 2.0
    depends_on:
      parser-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os; assert os.path.exists('/run/gabflow-parser/parser.sock')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.12.3
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull ${AI_TRIAGE_MODEL:-qwen2.5:3b} && ollama pull ${ELECTORAL_AI_MODEL:-qwen2.5:7b} && ollama pull ${AI_EMBEDDING_MODEL:-nomic-embed-text} && ollama pull ${RAG_NLI_MODEL:-qwen2.5:0.5b} && ollama pull ${RAG_PROMPT_INJECTION_CLASSIFIER_MODEL:-qwen2.5:1.5b}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  searxng:
    image: searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-gabflow-local-search-change-me}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/config"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  whisper-init:
    build:
      context: ./backend
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        python -c "import os; from faster_whisper import WhisperModel;
        WhisperModel(os.environ['AUDIO_TRANSCRIPTION_MODEL'],
        device=os.environ['AUDIO_TRANSCRIPTION_DEVICE'],
        compute_type=os.environ['AUDIO_TRANSCRIPTION_COMPUTE_TYPE'],
        download_root=os.environ['AUDIO_TRANSCRIPTION_CACHE_DIR'])" &&
        chown -R gabflow:gabflow /models/whisper
    environment:
      AUDIO_TRANSCRIPTION_MODEL: ${AUDIO_TRANSCRIPTION_MODEL:-base}
      AUDIO_TRANSCRIPTION_DEVICE: ${AUDIO_TRANSCRIPTION_DEVICE:-cpu}
      AUDIO_TRANSCRIPTION_COMPUTE_TYPE: ${AUDIO_TRANSCRIPTION_COMPUTE_TYPE:-int8}
      AUDIO_TRANSCRIPTION_CACHE_DIR: ${AUDIO_TRANSCRIPTION_CACHE_DIR:-/models/whisper}
    volumes:
      - whisper_models:/models/whisper
    restart: "no"

  db:
    build:
      context: ./backend
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gabflow}
      POSTGRES_USER: ${POSTGRES_USER:-gabflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gabflow} -d ${POSTGRES_DB:-gabflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db-roles:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-gabflow}
      PGUSER: ${POSTGRES_USER:-gabflow}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-gabflow_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      WORKER_DB_USER: ${WORKER_DB_USER:-gabflow_worker}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      BACKUP_DB_USER: ${BACKUP_DB_USER:-gabflow_backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - ./backend/db-bootstrap-roles.sql:/bootstrap/db-bootstrap-roles.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql
        -v database_name="$$PGDATABASE"
        -v migrator_role="$$PGUSER"
        -v app_role="$$APP_DB_USER"
        -v app_password="$$APP_DB_PASSWORD"
        -v worker_role="$$WORKER_DB_USER"
        -v worker_password="$$WORKER_DB_PASSWORD"
        -v backup_role="$$BACKUP_DB_USER"
        -v backup_password="$$BACKUP_DB_PASSWORD"
        -f /bootstrap/db-bootstrap-roles.sql
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  migrate:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_RELEASE: ${APP_RELEASE:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gabflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gabflow}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY no arquivo .env}
      STORAGE_ENCRYPTION_MASTER_KEY: ${STORAGE_ENCRYPTION_MASTER_KEY:-${SECRET_KEY}}
      STORAGE_ENCRYPTION_KEY_VERSION: ${STORAGE_ENCRYPTION_KEY_VERSION:-1}
      RUN_MIGRATIONS_ON_START: "true"
      RUN_SEEDS_ON_START: "true"
      SEED_ADMIN_ON_START: ${SEED_ADMIN_ON_START:-true}
      SEED_TENANT: ${SEED_TENANT:-gabinete-demo}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@gabflow.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Defina SEED_ADMIN_PASSWORD no arquivo .env}
      SEED_PLATFORM_ADMIN_ON_START: ${SEED_PLATFORM_ADMIN_ON_START:-false}
      SEED_PLATFORM_ADMIN_EMAIL: ${SEED_PLATFORM_ADMIN_EMAIL:-platform@gabflow.local}
      SEED_PLATFORM_ADMIN_PASSWORD: ${SEED_PLATFORM_ADMIN_PASSWORD:-}
      APP_DB_USER: ${APP_DB_USER:-gabflow_app}
      WORKER_DB_USER: ${WORKER_DB_USER:-gabflow_worker}
      ELECTORAL_STORAGE_PATH: /app/data/electoral
      ELECTORAL_MAX_ARCHIVE_BYTES: ${ELECTORAL_MAX_ARCHIVE_BYTES:-2147483648}
      ELECTORAL_MAX_UNCOMPRESSED_BYTES: ${ELECTORAL_MAX_UNCOMPRESSED_BYTES:-8589934592}
      ELECTORAL_IMPORT_BATCH_SIZE: ${ELECTORAL_IMPORT_BATCH_SIZE:-2000}
      ELECTORAL_REPORT_RETENTION_DAYS: ${ELECTORAL_REPORT_RETENTION_DAYS:-30}
      ELECTORAL_REPORT_LINK_MAX_AGE_SECONDS: ${ELECTORAL_REPORT_LINK_MAX_AGE_SECONDS:-300}
      ELECTORAL_REPORT_MAX_ROWS: ${ELECTORAL_REPORT_MAX_ROWS:-10000}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      GEOCODE_EARTH_API_KEY: ${GEOCODE_EARTH_API_KEY:-}
    volumes:
      - electoral_data:/app/data/electoral
    command: ["true"]
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_RELEASE: ${APP_RELEASE:-local}
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:-gabflow_app}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB:-gabflow}
      DB_ENFORCE_RUNTIME_ROLE: "true"
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY no arquivo .env}
      STORAGE_ENCRYPTION_MASTER_KEY: ${STORAGE_ENCRYPTION_MASTER_KEY:-${SECRET_KEY}}
      STORAGE_ENCRYPTION_KEY_VERSION: ${STORAGE_ENCRYPTION_KEY_VERSION:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_TIMEOUT_SECONDS: ${RESEND_TIMEOUT_SECONDS:-10}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      RESEND_WEBHOOK_TOLERANCE_SECONDS: ${RESEND_WEBHOOK_TOLERANCE_SECONDS:-300}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      AI_TRIAGE_PROVIDER: ${AI_TRIAGE_PROVIDER:-ollama}
      AI_TRIAGE_MODEL: ${AI_TRIAGE_MODEL:-qwen2.5:3b}
      AI_TRIAGE_FALLBACK_MODEL: ${AI_TRIAGE_FALLBACK_MODEL:-gabflow-triage-rules-v1}
      AI_TRIAGE_PROMPT_VERSION: ${AI_TRIAGE_PROMPT_VERSION:-triage-v3}
      AI_TRIAGE_TIMEOUT_SECONDS: ${AI_TRIAGE_TIMEOUT_SECONDS:-120}
      AI_TRIAGE_FALLBACK_ENABLED: ${AI_TRIAGE_FALLBACK_ENABLED:-true}
      AI_ASSISTANCE_PROVIDER: ${AI_ASSISTANCE_PROVIDER:-ollama}
      AI_ASSISTANCE_MODEL: ${AI_ASSISTANCE_MODEL:-qwen2.5:3b}
      AI_ASSISTANCE_FALLBACK_MODEL: ${AI_ASSISTANCE_FALLBACK_MODEL:-gabflow-assistance-rules-v1}
      AI_ASSISTANCE_PROMPT_VERSION: ${AI_ASSISTANCE_PROMPT_VERSION:-assistance-v1}
      AI_ASSISTANCE_TIMEOUT_SECONDS: ${AI_ASSISTANCE_TIMEOUT_SECONDS:-120}
      AI_ASSISTANCE_FALLBACK_ENABLED: ${AI_ASSISTANCE_FALLBACK_ENABLED:-true}
      AI_LEGISLATIVE_PROVIDER: ${AI_LEGISLATIVE_PROVIDER:-ollama}
      AI_LEGISLATIVE_MODEL: ${AI_LEGISLATIVE_MODEL:-qwen2.5:3b}
      AI_LEGISLATIVE_FALLBACK_MODEL: ${AI_LEGISLATIVE_FALLBACK_MODEL:-gabflow-legislative-rules-v1}
      AI_LEGISLATIVE_PROMPT_VERSION: ${AI_LEGISLATIVE_PROMPT_VERSION:-legislative-v1}
      AI_LEGISLATIVE_TIMEOUT_SECONDS: ${AI_LEGISLATIVE_TIMEOUT_SECONDS:-120}
      AI_LEGISLATIVE_FALLBACK_ENABLED: ${AI_LEGISLATIVE_FALLBACK_ENABLED:-true}
      AI_DUPLICATE_PROVIDER: ${AI_DUPLICATE_PROVIDER:-ollama}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-nomic-embed-text}
      AI_DUPLICATE_WINDOW_DAYS: ${AI_DUPLICATE_WINDOW_DAYS:-180}
      AI_DUPLICATE_SCORE_THRESHOLD: ${AI_DUPLICATE_SCORE_THRESHOLD:-0.72}
      AI_DUPLICATE_MAX_SUGGESTIONS: ${AI_DUPLICATE_MAX_SUGGESTIONS:-5}
      AI_DUPLICATE_CANDIDATE_LIMIT: ${AI_DUPLICATE_CANDIDATE_LIMIT:-100}
      AI_PRECEDENT_PROVIDER: ${AI_PRECEDENT_PROVIDER:-ollama}
      AI_PRECEDENT_SCORE_THRESHOLD: ${AI_PRECEDENT_SCORE_THRESHOLD:-0.60}
      AI_PRECEDENT_MAX_RESULTS: ${AI_PRECEDENT_MAX_RESULTS:-10}
      AI_PRECEDENT_CANDIDATE_LIMIT: ${AI_PRECEDENT_CANDIDATE_LIMIT:-200}
      AI_FOUNDATION_PROVIDER: ${AI_FOUNDATION_PROVIDER:-ollama}
      AI_FOUNDATION_SCORE_THRESHOLD: ${AI_FOUNDATION_SCORE_THRESHOLD:-0.55}
      AI_FOUNDATION_MAX_RESULTS: ${AI_FOUNDATION_MAX_RESULTS:-5}
      AI_FOUNDATION_CANDIDATE_LIMIT: ${AI_FOUNDATION_CANDIDATE_LIMIT:-200}
      ELECTORAL_AI_ENABLED: ${ELECTORAL_AI_ENABLED:-true}
      ELECTORAL_AI_PROVIDER: ${ELECTORAL_AI_PROVIDER:-ollama}
      ELECTORAL_AI_MODEL: ${ELECTORAL_AI_MODEL:-qwen2.5:7b}
      ELECTORAL_AI_PROMPT_VERSION: ${ELECTORAL_AI_PROMPT_VERSION:-electoral-grounded-generation-v1}
      ELECTORAL_AI_TIMEOUT_SECONDS: ${ELECTORAL_AI_TIMEOUT_SECONDS:-240}
      ELECTORAL_AI_MAX_EVIDENCE_CHARS: ${ELECTORAL_AI_MAX_EVIDENCE_CHARS:-12000}
      ELECTORAL_AI_MAX_CLAIMS: ${ELECTORAL_AI_MAX_CLAIMS:-4}
      ELECTORAL_AI_MAX_HYPOTHESES: ${ELECTORAL_AI_MAX_HYPOTHESES:-3}
      ELECTORAL_AI_MAX_TOKENS: ${ELECTORAL_AI_MAX_TOKENS:-1024}
      ELECTORAL_AI_KEEP_ALIVE: ${ELECTORAL_AI_KEEP_ALIVE:-24h}
      ELECTORAL_AI_FALLBACK_ENABLED: ${ELECTORAL_AI_FALLBACK_ENABLED:-true}
      ELECTORAL_WEB_RESEARCH_ENABLED: ${ELECTORAL_WEB_RESEARCH_ENABLED:-true}
      ELECTORAL_WEB_RESEARCH_BASE_URL: ${ELECTORAL_WEB_RESEARCH_BASE_URL:-http://searxng:8080}
      ELECTORAL_WEB_RESEARCH_TIMEOUT_SECONDS: ${ELECTORAL_WEB_RESEARCH_TIMEOUT_SECONDS:-25}
      ELECTORAL_WEB_RESEARCH_MAX_RESULTS: ${ELECTORAL_WEB_RESEARCH_MAX_RESULTS:-5}
      AUDIO_TRANSCRIPTION_PROVIDER: ${AUDIO_TRANSCRIPTION_PROVIDER:-faster-whisper}
      AUDIO_TRANSCRIPTION_MODEL: ${AUDIO_TRANSCRIPTION_MODEL:-base}
      AUDIO_TRANSCRIPTION_DEVICE: ${AUDIO_TRANSCRIPTION_DEVICE:-cpu}
      AUDIO_TRANSCRIPTION_COMPUTE_TYPE: ${AUDIO_TRANSCRIPTION_COMPUTE_TYPE:-int8}
      AUDIO_TRANSCRIPTION_LANGUAGE: ${AUDIO_TRANSCRIPTION_LANGUAGE:-pt}
      AUDIO_TRANSCRIPTION_CACHE_DIR: ${AUDIO_TRANSCRIPTION_CACHE_DIR:-/models/whisper}
      AUDIO_TRANSCRIPTION_MAX_DURATION_SECONDS: ${AUDIO_TRANSCRIPTION_MAX_DURATION_SECONDS:-900}
      DOCUMENT_OCR_PROVIDER: ${DOCUMENT_OCR_PROVIDER:-tesseract}
      DOCUMENT_OCR_MODEL: ${DOCUMENT_OCR_MODEL:-tesseract-5}
      DOCUMENT_OCR_LANGUAGE: ${DOCUMENT_OCR_LANGUAGE:-por}
      DOCUMENT_OCR_MAX_PAGES: ${DOCUMENT_OCR_MAX_PAGES:-500}
      DOCUMENT_OCR_MAX_PIXELS: ${DOCUMENT_OCR_MAX_PIXELS:-25000000}
      DOCUMENT_OCR_NATIVE_MIN_CHARS: ${DOCUMENT_OCR_NATIVE_MIN_CHARS:-40}
      DOCUMENT_OCR_BATCH_SIZE: ${DOCUMENT_OCR_BATCH_SIZE:-8}
      DOCUMENT_PARSER_ISOLATION_ENABLED: ${DOCUMENT_PARSER_ISOLATION_ENABLED:-true}
      DOCUMENT_PARSER_SOCKET_PATH: /run/gabflow-parser/parser.sock
      DOCUMENT_PARSER_TIMEOUT_SECONDS: ${DOCUMENT_PARSER_TIMEOUT_SECONDS:-120}
      DOCUMENT_PARSER_MAX_RESPONSE_BYTES: ${DOCUMENT_PARSER_MAX_RESPONSE_BYTES:-10485760}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      ATTACHMENT_STORAGE_PATH: /app/data/attachments
      MAX_ATTACHMENT_BYTES: ${MAX_ATTACHMENT_BYTES:-15728640}
      ATTACHMENT_TOKEN_MAX_AGE: ${ATTACHMENT_TOKEN_MAX_AGE:-300}
      MALWARE_SCANNER_ENABLED: ${MALWARE_SCANNER_ENABLED:-true}
      MALWARE_SCANNER_REQUIRED: ${MALWARE_SCANNER_REQUIRED:-true}
      MALWARE_SCANNER_PROVIDER: ${MALWARE_SCANNER_PROVIDER:-clamd}
      MALWARE_SCANNER_HOST: ${MALWARE_SCANNER_HOST:-clamav}
      MALWARE_SCANNER_PORT: ${MALWARE_SCANNER_PORT:-3310}
      MALWARE_SCANNER_TIMEOUT_SECONDS: ${MALWARE_SCANNER_TIMEOUT_SECONDS:-30}
      MALWARE_SCANNER_MAX_BYTES: ${MALWARE_SCANNER_MAX_BYTES:-31457280}
      MALWARE_SCANNER_CHUNK_BYTES: ${MALWARE_SCANNER_CHUNK_BYTES:-65536}
      RAG_STORAGE_PATH: /app/data/rag
      ELECTORAL_STORAGE_PATH: /app/data/electoral
      ELECTORAL_REPORT_RETENTION_DAYS: ${ELECTORAL_REPORT_RETENTION_DAYS:-30}
      ELECTORAL_REPORT_LINK_MAX_AGE_SECONDS: ${ELECTORAL_REPORT_LINK_MAX_AGE_SECONDS:-300}
      ELECTORAL_REPORT_MAX_ROWS: ${ELECTORAL_REPORT_MAX_ROWS:-10000}
      RAG_MAX_DOCUMENT_BYTES: ${RAG_MAX_DOCUMENT_BYTES:-26214400}
      RAG_DOWNLOAD_TOKEN_MAX_AGE: ${RAG_DOWNLOAD_TOKEN_MAX_AGE:-300}
      RAG_ALLOW_LEGACY_STORAGE_KEYS: ${RAG_ALLOW_LEGACY_STORAGE_KEYS:-true}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-ollama}
      RAG_INGESTION_TIMEOUT_SECONDS: ${RAG_INGESTION_TIMEOUT_SECONDS:-120}
      RAG_CHUNK_SIZE_CHARS: ${RAG_CHUNK_SIZE_CHARS:-1200}
      RAG_CHUNK_OVERLAP_CHARS: ${RAG_CHUNK_OVERLAP_CHARS:-150}
      RAG_MIN_TEXT_CHARS: ${RAG_MIN_TEXT_CHARS:-20}
      RAG_OPERATIONAL_MEMORY_ENABLED: ${RAG_OPERATIONAL_MEMORY_ENABLED:-true}
      RAG_RETRIEVAL_MAX_RESULTS: ${RAG_RETRIEVAL_MAX_RESULTS:-5}
      RAG_RETRIEVAL_CANDIDATE_LIMIT: ${RAG_RETRIEVAL_CANDIDATE_LIMIT:-200}
      RAG_RETRIEVAL_SCAN_BATCH_SIZE: ${RAG_RETRIEVAL_SCAN_BATCH_SIZE:-500}
      RAG_QUERY_EXPANSION_MAX_QUERIES: ${RAG_QUERY_EXPANSION_MAX_QUERIES:-3}
      RAG_RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT: ${RAG_RETRIEVAL_MAX_CHUNKS_PER_DOCUMENT:-2}
      RAG_RETRIEVAL_SCORE_THRESHOLD: ${RAG_RETRIEVAL_SCORE_THRESHOLD:-0.28}
      RAG_RETRIEVAL_MIN_EVIDENCE_SCORE: ${RAG_RETRIEVAL_MIN_EVIDENCE_SCORE:-0.42}
      RAG_RETRIEVAL_AUTHORITY_RERANK_WEIGHT: ${RAG_RETRIEVAL_AUTHORITY_RERANK_WEIGHT:-0.03}
      RAG_RETRIEVAL_FRESHNESS_RERANK_WEIGHT: ${RAG_RETRIEVAL_FRESHNESS_RERANK_WEIGHT:-0.01}
      RAG_NEURAL_RERANK_ENABLED: ${RAG_NEURAL_RERANK_ENABLED:-true}
      RAG_NEURAL_RERANK_PROVIDER: ${RAG_NEURAL_RERANK_PROVIDER:-ollama}
      RAG_NEURAL_RERANK_MODEL: ${RAG_NEURAL_RERANK_MODEL:-qwen2.5:3b}
      RAG_NEURAL_RERANK_PROMPT_VERSION: ${RAG_NEURAL_RERANK_PROMPT_VERSION:-rag-neural-rerank-v1}
      RAG_NEURAL_RERANK_TIMEOUT_SECONDS: ${RAG_NEURAL_RERANK_TIMEOUT_SECONDS:-8}
      RAG_NEURAL_RERANK_CANDIDATE_LIMIT: ${RAG_NEURAL_RERANK_CANDIDATE_LIMIT:-12}
      RAG_NEURAL_RERANK_CONTENT_CHARS: ${RAG_NEURAL_RERANK_CONTENT_CHARS:-700}
      RAG_NEURAL_RERANK_WEIGHT: ${RAG_NEURAL_RERANK_WEIGHT:-0.55}
      RAG_NEURAL_RERANK_MIN_SCORE: ${RAG_NEURAL_RERANK_MIN_SCORE:-0.20}
      RAG_NEURAL_RERANK_FALLBACK_ENABLED: ${RAG_NEURAL_RERANK_FALLBACK_ENABLED:-true}
      RAG_NEURAL_RERANK_ADAPTIVE_ENABLED: ${RAG_NEURAL_RERANK_ADAPTIVE_ENABLED:-true}
      RAG_NEURAL_RERANK_SKIP_MIN_SCORE: ${RAG_NEURAL_RERANK_SKIP_MIN_SCORE:-0.70}
      RAG_NEURAL_RERANK_SKIP_MIN_MARGIN: ${RAG_NEURAL_RERANK_SKIP_MIN_MARGIN:-0.10}
      RAG_NEURAL_RERANK_MAX_TOKENS: ${RAG_NEURAL_RERANK_MAX_TOKENS:-384}
      RAG_CONTENT_SECURITY_POLICY_VERSION: ${RAG_CONTENT_SECURITY_POLICY_VERSION:-rag-content-security-v2}
      RAG_CONTENT_SECURITY_DETECTOR_VERSION: ${RAG_CONTENT_SECURITY_DETECTOR_VERSION:-canonical-deterministic-v2}
      RAG_CONTENT_SECURITY_MAX_CANONICAL_CHARS: ${RAG_CONTENT_SECURITY_MAX_CANONICAL_CHARS:-1000000}
