      RAG_ANSWER_MAX_SOURCES: ${RAG_ANSWER_MAX_SOURCES:-3}
      RAG_ANSWER_SOURCE_CHARS: ${RAG_ANSWER_SOURCE_CHARS:-900}
      RAG_ANSWER_MAX_CLAIMS: ${RAG_ANSWER_MAX_CLAIMS:-5}
      RAG_ANSWER_MAX_CHARS: ${RAG_ANSWER_MAX_CHARS:-5000}
      RAG_ANSWER_MAX_TOKENS: ${RAG_ANSWER_MAX_TOKENS:-512}
      RAG_ANSWER_CITATION_SUPPORT_THRESHOLD: ${RAG_ANSWER_CITATION_SUPPORT_THRESHOLD:-0.18}
      RAG_ANSWER_FALLBACK_REFUSAL_ENABLED: ${RAG_ANSWER_FALLBACK_REFUSAL_ENABLED:-true}
      RAG_ENTAILMENT_ENABLED: ${RAG_ENTAILMENT_ENABLED:-true}
      RAG_ENTAILMENT_PROVIDER: ${RAG_ENTAILMENT_PROVIDER:-ollama}
      RAG_ENTAILMENT_MODEL: ${RAG_ENTAILMENT_MODEL:-qwen2.5:3b}
      RAG_ENTAILMENT_PROMPT_VERSION: ${RAG_ENTAILMENT_PROMPT_VERSION:-rag-entailment-v1}
      RAG_ENTAILMENT_TIMEOUT_SECONDS: ${RAG_ENTAILMENT_TIMEOUT_SECONDS:-45}
      RAG_ENTAILMENT_MIN_SCORE: ${RAG_ENTAILMENT_MIN_SCORE:-0.72}
      RAG_ENTAILMENT_FAIL_CLOSED: ${RAG_ENTAILMENT_FAIL_CLOSED:-true}
      RAG_NLI_ENABLED: ${RAG_NLI_ENABLED:-true}
      RAG_NLI_PROVIDER: ${RAG_NLI_PROVIDER:-ollama}
      RAG_NLI_BASE_URL: ${RAG_NLI_BASE_URL:-http://ollama:11434}
      RAG_NLI_MODEL: ${RAG_NLI_MODEL:-qwen2.5:0.5b}
      RAG_NLI_PROMPT_VERSION: ${RAG_NLI_PROMPT_VERSION:-rag-nli-v2}
      RAG_NLI_TIMEOUT_SECONDS: ${RAG_NLI_TIMEOUT_SECONDS:-12}
      RAG_NLI_MIN_SCORE: ${RAG_NLI_MIN_SCORE:-0.72}
      RAG_NLI_FAIL_CLOSED: ${RAG_NLI_FAIL_CLOSED:-true}
      RAG_NLI_REQUIRE_DISTINCT_MODEL: ${RAG_NLI_REQUIRE_DISTINCT_MODEL:-true}
      RAG_NLI_MAX_EVIDENCE_CHARS: ${RAG_NLI_MAX_EVIDENCE_CHARS:-2400}
      RAG_NLI_MAX_TOKENS: ${RAG_NLI_MAX_TOKENS:-256}
      RAG_QUERY_LATENCY_BUDGET_MS: ${RAG_QUERY_LATENCY_BUDGET_MS:-30000}
      RAG_QUALITY_ONLINE_MIN_SAMPLES: ${RAG_QUALITY_ONLINE_MIN_SAMPLES:-20}
      RAG_QUALITY_ONLINE_MAX_FALLBACK_RATE: ${RAG_QUALITY_ONLINE_MAX_FALLBACK_RATE:-0.20}
      RAG_QUALITY_ONLINE_MAX_SEMANTIC_REJECTION_RATE: ${RAG_QUALITY_ONLINE_MAX_SEMANTIC_REJECTION_RATE:-0.30}
      RAG_QUALITY_ONLINE_MAX_REFUSAL_RATE: ${RAG_QUALITY_ONLINE_MAX_REFUSAL_RATE:-0.50}
      RAG_QUALITY_ONLINE_MAX_LATENCY_BUDGET_RATE: ${RAG_QUALITY_ONLINE_MAX_LATENCY_BUDGET_RATE:-0.10}
      RAG_QUALITY_ROLLOUT_STAGES: ${RAG_QUALITY_ROLLOUT_STAGES:-5,20,50,100}
      RAG_QUALITY_ROLLOUT_MIN_SAMPLES: ${RAG_QUALITY_ROLLOUT_MIN_SAMPLES:-20}
      RAG_QUALITY_ROLLOUT_MIN_WINDOW_SECONDS: ${RAG_QUALITY_ROLLOUT_MIN_WINDOW_SECONDS:-3600}
      RAG_QUALITY_ROLLOUT_CHECK_INTERVAL_SECONDS: ${RAG_QUALITY_ROLLOUT_CHECK_INTERVAL_SECONDS:-300}
      RAG_QUALITY_ROLLOUT_MAX_RATE_REGRESSION: ${RAG_QUALITY_ROLLOUT_MAX_RATE_REGRESSION:-0.05}
      RAG_THEMATIC_MIN_GROUP_SIZE: ${RAG_THEMATIC_MIN_GROUP_SIZE:-3}
      RAG_LEARNING_MIN_SIGNALS: ${RAG_LEARNING_MIN_SIGNALS:-3}
      RAG_LEARNING_MAX_ADJUSTMENT: ${RAG_LEARNING_MAX_ADJUSTMENT:-0.12}
      RAG_LEARNING_DECAY_HALF_LIFE_DAYS: ${RAG_LEARNING_DECAY_HALF_LIFE_DAYS:-90}
      RAG_LEARNING_MAX_EXAMPLES: ${RAG_LEARNING_MAX_EXAMPLES:-200}
      RAG_LEARNING_EVALUATION_K: ${RAG_LEARNING_EVALUATION_K:-5}
      RAG_LEARNING_MAX_REGRESSION: ${RAG_LEARNING_MAX_REGRESSION:-0.05}
      RAG_LEARNING_CANARY_PERCENT: ${RAG_LEARNING_CANARY_PERCENT:-10}
      RAG_LEARNING_ONLINE_MIN_SAMPLES: ${RAG_LEARNING_ONLINE_MIN_SAMPLES:-10}
      RAG_LEARNING_ONLINE_MAX_NEGATIVE_RATE: ${RAG_LEARNING_ONLINE_MAX_NEGATIVE_RATE:-0.60}
    volumes:
      - attachment_data:/app/data/attachments
      - rag_data:/app/data/rag
      - electoral_data:/app/data/electoral
      - parser_socket:/run/gabflow-parser
      - whisper_models:/models/whisper
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    depends_on:
      clamav:
        condition: service_healthy
      parser:
        condition: service_healthy
      api:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      searxng:
        condition: service_healthy
      whisper-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-rag:
    extends:
      service: worker
    environment:
      WORKER_QUEUE: rag
      WORKER_RUN_SCHEDULER: "false"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
        VITE_APP_RELEASE: ${APP_RELEASE:-local}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clamav_data:
  parser_socket:
  postgres_data:
  attachment_data:
  rag_data:
  electoral_data:
  ollama_data:
  whisper_models:
