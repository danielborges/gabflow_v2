name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      activate_services:
        description: Ativar API e workers depois da migration
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Provision, migrate and deploy
    runs-on: ubuntu-latest
    environment: staging
    env:
      TF_ROOT: infra/terraform/environments/staging
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: ${{ vars.AWS_STAGING_REGION }}
      EXPECTED_ACCOUNT_ID: ${{ vars.AWS_STAGING_ACCOUNT_ID }}
      TF_VAR_certificate_arn: ${{ vars.AWS_STAGING_CERTIFICATE_ARN }}
      VITE_GEOAPIFY_MAP_API_KEY: ${{ vars.VITE_GEOAPIFY_MAP_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_STAGING_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS credentials
        run: |
          echo "Checking AWS identity"
          aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize Terraform
        run: >-
          terraform -chdir="$TF_ROOT" init
          -backend-config="bucket=${{ vars.AWS_STAGING_STATE_BUCKET }}"
          -backend-config="region=$AWS_REGION"
          -backend-config="kms_key_id=${{ vars.AWS_STAGING_STATE_KMS_KEY_ARN }}"

      - name: Provision runtime with services disabled
        run: |
          terraform -chdir="$TF_ROOT" apply -auto-approve \
            -var="expected_account_id=$EXPECTED_ACCOUNT_ID" \
            -var="image_tag=${GITHUB_SHA}" \
            -var="enable_services=false"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve immutable repository URLs
        id: repositories
        run: |
          echo "backend=$(terraform -chdir="$TF_ROOT" output -json ecr_repository_urls | jq -r .backend)" >> "$GITHUB_OUTPUT"
          echo "web=$(terraform -chdir="$TF_ROOT" output -json ecr_repository_urls | jq -r .web)" >> "$GITHUB_OUTPUT"

      - name: Build and publish backend
        run: |
          docker build -t "${{ steps.repositories.outputs.backend }}:${GITHUB_SHA}" backend
          docker push "${{ steps.repositories.outputs.backend }}:${GITHUB_SHA}"

      - name: Build and publish web
        run: |
          test -n "$VITE_GEOAPIFY_MAP_API_KEY"
          docker build --build-arg API_UPSTREAM=127.0.0.1:5000 \
            --build-arg VITE_APP_ENV=staging \
            --build-arg VITE_TERRITORIAL_MAP_ENABLED=true \
            --build-arg VITE_GEOAPIFY_MAP_API_KEY="$VITE_GEOAPIFY_MAP_API_KEY" \
            -f frontend/Dockerfile \
            -t "${{ steps.repositories.outputs.web }}:${GITHUB_SHA}" .
          docker push "${{ steps.repositories.outputs.web }}:${GITHUB_SHA}"

      - name: Register release task definitions
        run: |
          terraform -chdir="$TF_ROOT" apply -auto-approve \
            -var="expected_account_id=$EXPECTED_ACCOUNT_ID" \
            -var="image_tag=${GITHUB_SHA}" \
            -var="enable_services=false"

      - name: Run database migration as one-shot task
        id: migration
        run: |
          set -eo pipefail
          echo "TF_ROOT=$TF_ROOT"
          cluster=$(terraform -chdir="$TF_ROOT" output -raw ecs_cluster_name)
          task_definition=$(terraform -chdir="$TF_ROOT" output -raw migration_task_definition_arn)
          security_group=$(terraform -chdir="$TF_ROOT" output -raw task_security_group_id)
          subnets=$(terraform -chdir="$TF_ROOT" output -json runtime_private_subnet_ids | jq -r 'join(",")')
          echo "Cluster: $cluster"
          echo "Task definition: $task_definition"
          echo "Subnets: $subnets"
          task_arn=$(aws ecs run-task \
            --cluster "$cluster" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --platform-version 1.4.0 \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_group],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$task_arn" ] || [ "$task_arn" = "None" ]; then
            echo "Failed to start migration task, task_arn: '$task_arn'"
            exit 1
          fi
          echo "Started task: $task_arn"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          describe_json=$(aws ecs describe-tasks --cluster "$cluster" --tasks "$task_arn" --output json)
          echo "Describe tasks: $describe_json"
          exit_code=$(echo "$describe_json" | jq -r '.tasks[0].containers[] | select(.name=="migration") | .exitCode // empty')
          if [ -z "$exit_code" ]; then
            echo "No exit code found in describe-tasks output; failing for inspection"
            exit 1
          fi
          echo "Container exit code: $exit_code"
          if [ "$exit_code" != "0" ]; then
            echo "Migration failed; container details:" 
            echo "$describe_json" | jq -r '.tasks[0].containers[] | {name: .name, exitCode: .exitCode, reason: .reason, stoppedReason: .stoppedReason, exitCodeDetails: .exitCodeDetails}'
            # Attempt to show CloudWatch log configuration if present (best-effort)
            log_group=$(echo "$describe_json" | jq -r '.tasks[0].containers[] | select(.name=="migration") | .logConfiguration.options."awslogs-group" // empty')
            log_stream_prefix=$(echo "$describe_json" | jq -r '.tasks[0].containers[] | select(.name=="migration") | .logConfiguration.options."awslogs-stream-prefix" // empty')
            if [ -n "$log_group" ]; then
              echo "Attempting to fetch CloudWatch logs (may require additional permissions): group=$log_group, prefix=$log_stream_prefix"
            else
              # Best-effort: derive log group from task definition family (e.g. gabflow-staging-migration)
              family=$(echo "$task_definition" | awk -F'/' '{print $2}' | awk -F':' '{print $1}')
              name_prefix=$(echo "$family" | sed 's/-migration$//')
              log_group="/ecs/${name_prefix}/migration"
              echo "Derived log_group: $log_group (family: $family, name_prefix: $name_prefix)"
            fi

            # Attempt to fetch the latest log stream and print recent events (best-effort)
            if aws logs describe-log-streams --log-group-name "$log_group" --order-by LastEventTime --descending --max-items 1 >/tmp/streams.json 2>/tmp/streams.err; then
              stream_name=$(jq -r '.logStreams[0].logStreamName' /tmp/streams.json)
              if [ -n "$stream_name" ]; then
                echo "Fetching last 200 log events from $log_group / $stream_name"
                aws logs get-log-events --log-group-name "$log_group" --log-stream-name "$stream_name" --limit 200 --start-from-head false || true
              else
                echo "No log streams found in $log_group"
              fi
            else
              echo "Failed to describe log streams for $log_group; see /tmp/streams.err"
              cat /tmp/streams.err || true
            fi
            exit "$exit_code"
          fi
          echo "Migration succeeded."

      - name: Activate application services
        if: ${{ inputs.activate_services }}
        run: |
          terraform -chdir="$TF_ROOT" apply -auto-approve \
            -var="expected_account_id=$EXPECTED_ACCOUNT_ID" \
            -var="image_tag=${GITHUB_SHA}" \
            -var="enable_services=true"

      - name: Publish staging URL
        run: |
          echo "Staging URL: $(terraform -chdir="$TF_ROOT" output -raw staging_url)" >> "$GITHUB_STEP_SUMMARY"
