asyncapi: 3.0.0
info:
  title: GabFlow Events
  version: 0.2.0
  description: Contrato de eventos de domínio e integração.
channels:
  solicitacaoCriada:
    address: gabflow.solicitacao.criada.v1
    messages:
      SolicitacaoCriada:
        $ref: "#/components/messages/SolicitacaoCriada"
  solicitacaoAtualizada:
    address: gabflow.solicitacao.atualizada.v1
    messages:
      SolicitacaoAtualizada:
        $ref: "#/components/messages/SolicitacaoAtualizada"
  respostaEmailSolicitacao:
    address: gabflow.comunicacao.resposta-email.v1
    messages:
      RespostaEmailSolicitacao:
        $ref: "#/components/messages/RespostaEmailSolicitacao"
  classificacaoConcluida:
    address: gabflow.ia.classificacao-concluida.v1
    messages:
      ClassificacaoConcluida:
        $ref: "#/components/messages/ClassificacaoConcluida"
  documentoIndexado:
    address: gabflow.rag.documento-indexado.v1
    messages:
      DocumentoIndexado:
        $ref: "#/components/messages/DocumentoIndexado"
  sincronizacaoMemoriaOperacionalV1:
    x-status: legacy
    address: gabflow.rag.memoria-operacional.sincronizacao.v1
    messages:
      SincronizacaoMemoriaOperacionalV1:
        $ref: "#/components/messages/SincronizacaoMemoriaOperacionalV1"
  sincronizacaoMemoriaOperacionalV2:
    x-status: current
    address: gabflow.rag.memoria-operacional.sincronizacao.v2
    messages:
      SincronizacaoMemoriaOperacionalV2:
        $ref: "#/components/messages/SincronizacaoMemoriaOperacionalV2"
  insightGerado:
    address: gabflow.analytics.insight-gerado.v1
    messages:
      InsightGerado:
        $ref: "#/components/messages/InsightGerado"
operations:
  publishSolicitacaoCriada:
    action: send
    channel:
      $ref: "#/channels/solicitacaoCriada"
  processRespostaEmailSolicitacao:
    action: receive
    channel:
      $ref: "#/channels/respostaEmailSolicitacao"
  receiveClassificacaoConcluida:
    action: receive
    channel:
      $ref: "#/channels/classificacaoConcluida"
  processSincronizacaoMemoriaOperacional:
    action: receive
    channel:
      $ref: "#/channels/sincronizacaoMemoriaOperacionalV1"
  processSincronizacaoMemoriaOperacionalV2:
    x-status: current
    action: receive
    channel:
      $ref: "#/channels/sincronizacaoMemoriaOperacionalV2"
components:
  messages:
    SolicitacaoCriada:
      payload:
        $ref: "#/components/schemas/DomainEvent"
    SolicitacaoAtualizada:
      payload:
        $ref: "#/components/schemas/DomainEvent"
    RespostaEmailSolicitacao:
      payload:
        allOf:
          - $ref: "#/components/schemas/DomainEvent"
          - type: object
            properties:
              data:
                type: object
                required: [solicitacaoId, destinatario, assunto, conteudo]
                properties:
                  solicitacaoId:
                    type: string
                    format: uuid
                  destinatario:
                    type: string
                    format: email
                  assunto:
                    type: string
                  conteudo:
                    type: string
    ClassificacaoConcluida:
      payload:
        allOf:
          - $ref: "#/components/schemas/DomainEvent"
          - type: object
            properties:
              data:
                type: object
                properties:
                  solicitacaoId:
                    type: string
                    format: uuid
                  categoria:
                    type: string
                  subcategoria:
                    type: string
                  prioridadeSugerida:
                    type: string
                  confianca:
                    type: number
    DocumentoIndexado:
      payload:
        $ref: "#/components/schemas/DomainEvent"
    SincronizacaoMemoriaOperacionalV1:
      payload:
        allOf:
          - $ref: "#/components/schemas/DomainEvent"
          - type: object
            properties:
              eventType:
                const: SincronizacaoMemoriaOperacional
              data:
                type: object
                additionalProperties: false
                required: [entityType, entityId]
                properties:
                  entityType:
                    type: string
                    maxLength: 80
                    enum:
                      - SERVICE_REQUEST
                      - REQUEST_FORWARDING
                      - LEGISLATIVE_DRAFT
                      - LEGISLATIVE_TRAMITATION
                      - DOCUMENT_OCR
                      - AUDIO_TRANSCRIPTION
                      - AGENDA_EVENT
                      - OVERSIGHT_ACTION
                      - THEMATIC_MEMORY
                  entityId:
                    type: string
                    format: uuid
            required: [eventType, data]
    SincronizacaoMemoriaOperacionalV2:
      x-status: current
      payload:
        allOf:
          - $ref: "#/components/schemas/DomainEvent"
          - type: object
            properties:
              eventType:
                const: SincronizacaoMemoriaOperacional
              data:
                type: object
                additionalProperties: false
                required:
                  [schemaVersion, sourceModule, entityType, entityId, action, revision]
                properties:
                  schemaVersion:
                    type: integer
                    const: 2
                  sourceModule:
                    type: string
                    maxLength: 60
                  entityType:
                    type: string
                    maxLength: 80
                    enum:
                      - SERVICE_REQUEST
                      - REQUEST_FORWARDING
                      - LEGISLATIVE_DRAFT
                      - LEGISLATIVE_TRAMITATION
                      - DOCUMENT_OCR
                      - AUDIO_TRANSCRIPTION
                      - AGENDA_EVENT
                      - OVERSIGHT_ACTION
                      - THEMATIC_MEMORY
                  entityId:
                    type: string
                    format: uuid
                  action:
                    type: string
                    enum:
                      [
                        CREATE,
                        UPDATE,
                        CANCEL,
                        DELETE,
                        ANONYMIZE,
                        RETENTION_EXPIRED,
                        RECONCILE,
                      ]
                  revision:
                    type: integer
                    minimum: 1
            required: [eventType, data]
    InsightGerado:
      payload:
        $ref: "#/components/schemas/DomainEvent"
  schemas:
    DomainEvent:
      type: object
      required: [eventId, eventType, tenantId, occurredAt, data]
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        tenantId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        correlationId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        version:
          type: integer
          default: 1
        data:
          type: object
          additionalProperties: true
