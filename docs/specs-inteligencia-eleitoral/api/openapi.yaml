components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token_cookie
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    CandidateId:
      name: candidate_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ElectionId:
      name: election_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    TerritoryLevel:
      name: level
      in: query
      required: true
      schema:
        type: string
        enum: [state, municipality, electoral_zone, neighborhood, polling_place, section]
    CommitmentId:
      name: commitment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Sessão ausente, expirada ou invalidada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Usuário sem permissão ou fora do tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Recurso inexistente ou fora do escopo autorizado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: Parâmetros ou regra de negócio inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    PublicCommitmentInput:
      type: object
      required: [title, description, territory_id, responsible_user_id, due_on]
      properties:
        title: { type: string, maxLength: 180 }
        description: { type: string, maxLength: 5000 }
        territory_id: { type: string, format: uuid }
        responsible_user_id: { type: string, format: uuid }
        due_on: { type: string, format: date }
        public_location_name: { type: string, maxLength: 180 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        location_is_public:
          type: boolean
          description: Deve ser true quando coordenadas forem informadas.
    PublicCommitmentUpdateInput:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        territory_id: { type: string, format: uuid }
        responsible_user_id: { type: string, format: uuid }
        due_on: { type: string, format: date }
        status: { type: string, enum: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        public_location_name: { type: [string, 'null'], maxLength: 180 }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        location_is_public: { type: boolean }
    PublicCommitmentEvidenceInput:
      type: object
      required: [title, public_url]
      properties:
        title: { type: string, minLength: 1, maxLength: 180 }
        description: { type: string, maxLength: 500 }
        public_url: { type: string, format: uri, maxLength: 2000, pattern: '^https?://' }
        evidence_date: { type: string, format: date }
    PublicCommitment:
      allOf:
        - $ref: '#/components/schemas/PublicCommitmentInput'
        - type: object
          required: [id, status, effective_status, status_source, progress, evidence, history]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED] }
            effective_status: { type: string, enum: [PLANNED, IN_PROGRESS, COMPLETED, CANCELLED, OVERDUE] }
