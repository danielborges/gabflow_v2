            properties:
              territory_id: { type: string, format: uuid }
              candidate_share_delta: { type: number, minimum: -1, maximum: 1 }
              denominator_delta: { type: number, minimum: -1, maximum: 1 }
              candidate_share_uncertainty: { type: number, minimum: 0, maximum: 1, default: 0 }
              denominator_uncertainty: { type: number, minimum: 0, maximum: 1, default: 0 }
              rationale: { type: string, maxLength: 500 }
    Scenario:
      allOf:
        - $ref: '#/components/schemas/ScenarioInput'
        - type: object
          required: [id, created_at, disclaimer, baseline_snapshot, result, methodology_version]
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            disclaimer: { type: string }
            baseline_snapshot: { type: object, additionalProperties: true }
            result: { type: object, additionalProperties: true }
            methodology_version: { type: string }
            source_scenario_id: { type: [string, 'null'], format: uuid }
            read_only: { type: boolean, default: false }
    ScenarioPreview:
      type: object
      required: [simulation, persisted, candidate, baseline, assumptions, result, methodology_version, disclaimer]
      properties:
        simulation: { type: boolean, const: true }
        persisted: { type: boolean, const: false }
        candidate: { type: object, additionalProperties: true }
        baseline: { type: object, additionalProperties: true }
        assumptions:
          type: array
          items: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }
        methodology_version: { type: string }
        disclaimer: { type: string }
    ScenarioPreviewInput:
      type: object
      required: [baseline_election_id, candidate_id, assumptions]
      properties:
        baseline_election_id: { type: string, format: uuid }
        candidate_id: { type: string, format: uuid }
        level: { type: string, enum: [municipality, electoral_zone, neighborhood, polling_place, section], default: municipality }
        municipality_code: { type: string }
        assumptions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [territory_id, rationale]
            properties:
              territory_id: { type: string, format: uuid }
              candidate_share_delta: { type: number, minimum: -1, maximum: 1 }
              denominator_delta: { type: number, minimum: -1, maximum: 1 }
              candidate_share_uncertainty: { type: number, minimum: 0, maximum: 1 }
              denominator_uncertainty: { type: number, minimum: 0, maximum: 1 }
              rationale: { type: string, minLength: 1, maxLength: 500 }
    ScenarioCopyInput:
      type: object
      properties:
        name: { type: string, maxLength: 160 }
        assumptions:
          $ref: '#/components/schemas/ScenarioInput/properties/assumptions'
    ScenarioComparisonInput:
      type: object
      required: [scenario_ids]
      properties:
        scenario_ids:
          type: array
          minItems: 2
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }
    ScenarioSensitivityInput:
      type: object
      properties:
        candidate_share_range_pp: { type: number, minimum: 0, maximum: 100, default: 5 }
        denominator_range_percent: { type: number, minimum: 0, maximum: 100, default: 5 }
        steps: { type: integer, minimum: 3, maximum: 11, default: 5 }
    ScenarioShareInput:
      type: object
      properties:
        expires_in_days: { type: integer, minimum: 1, maximum: 30, default: 7 }
    ScenarioShare:
      type: object
      required: [id, scenario_id, read_only, expires_at, url]
      properties:
        id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        read_only: { type: boolean, const: true }
        expires_at: { type: string, format: date-time }
        url: { type: string, format: uri }
    ScenarioShareMetadata:
      type: object
      required: [id, scenario_id, created_by_id, status, read_only, expires_at, access_count, created_at]
      properties:
        id: { type: string, format: uuid }
        scenario_id: { type: string, format: uuid }
        created_by_id: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, EXPIRED, REVOKED] }
        read_only: { type: boolean, const: true }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
        access_count: { type: integer, minimum: 0 }
        last_accessed_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    ScenarioAnalysis:
      type: object
      required: [id, analysis_type, anchor_scenario_id, scenario_ids, parameters, result, methodology_version, created_at]
      properties:
        id: { type: string, format: uuid }
        analysis_type: { type: string, enum: [COMPARISON, SENSITIVITY] }
        anchor_scenario_id: { type: string, format: uuid }
        scenario_ids:
          type: array
          items: { type: string, format: uuid }
        parameters: { type: object, additionalProperties: true }
        result: { type: object, additionalProperties: true }
        methodology_version: { type: string }
        created_by_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ScenarioPortfolioInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        scenario_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, format: uuid }
    ScenarioPortfolioGoal:
      type: object
      required: [scope, metric, target_value]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [TOTAL, TERRITORY] }
        territory_id: { type: [string, 'null'], format: uuid }
        metric: { type: string, enum: [VOTES, SHARE] }
        target_value: { type: number, minimum: 0 }
        rationale: { type: string, maxLength: 500 }
    ScenarioPortfolio:
      allOf:
        - $ref: '#/components/schemas/ScenarioPortfolioInput'
        - type: object
          required: [id, status, goals, scenarios, simulation, disclaimer, methodology_version, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [ACTIVE, ARCHIVED] }
            reference_scenario_id: { type: [string, 'null'], format: uuid }
            goals:
              type: array
              items: { $ref: '#/components/schemas/ScenarioPortfolioGoal' }
            scenarios:
              type: array
              items: { type: object, additionalProperties: true }
            evaluation: { type: object, additionalProperties: true }
            simulation: { type: boolean, const: true }
            disclaimer: { type: string }
            methodology_version: { type: string }
            created_by_id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ReportRequest:
      type: object
      required: [report_type, format, purpose, election_id, candidate_ids, level]
      properties:
        report_type: { type: string, enum: [candidate, comparison] }
        format: { type: string, enum: [PDF, CSV, XLSX] }
        purpose: { type: string, minLength: 10, maxLength: 500 }
        election_id: { type: string, format: uuid }
        candidate_ids:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string, format: uuid }
        level: { type: string, enum: [municipality, electoral_zone, neighborhood, polling_place, section] }
        municipality_code: { type: string }
    ReportJob:
      type: object
      required: [id, report_type, format, purpose, status, filters, requested_at]
      properties:
        id: { type: string, format: uuid }
        report_type: { type: string, enum: [candidate, comparison] }
        format: { type: string, enum: [PDF, CSV, XLSX] }
        purpose: { type: string }
        status: { type: string, enum: [QUEUED, PROCESSING, COMPLETED, FAILED, REVOKED] }
        filters: { type: object }
        source_metadata: { type: object }
        error: { type: [string, 'null'] }
        requested_at: { type: string, format: date-time }
        report: { type: [object, 'null'] }
    DelegationRequest:
      type: object
      required: [grantee_user_id, capabilities, valid_days, reason]
      properties:
        grantee_user_id: { type: string, format: uuid }
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [consultar_dados_publicos, ver_camadas_mandato, comparar_candidatos, usar_ia, criar_cenario, exportar]
        valid_days: { type: integer, minimum: 1, maximum: 90, default: 7 }
        reason: { type: string, minLength: 10, maxLength: 500 }
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
