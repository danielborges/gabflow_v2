openapi: 3.1.0
info:
  title: GabFlow Electoral Intelligence API
  version: 8.9.1
  description: API inicial do módulo Inteligência Eleitoral e Territorial.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: Access
  - name: Elections
  - name: Candidates
  - name: Analytics
  - name: Mandate Intelligence
  - name: Scenarios
  - name: Reports
paths:
  /electoral/disponibilidade:
    get:
      tags: [Access]
      operationId: getElectoralAvailability
      summary: Valida módulo, plano, mandato e capacidade do ator.
      responses:
        '200':
          description: Fundação eleitoral disponível para o ator autorizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectoralAvailability'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /electoral/elections:
    get:
      tags: [Elections]
      operationId: listElections
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Eleições disponíveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElectionPage'
  /electoral/elections/explore:
    get:
      tags: [Elections]
      operationId: exploreElections
      summary: Lista o catálogo público completo fora do contexto operacional do mandato.
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Eleições publicadas disponíveis para pesquisa exploratória.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectionPage' }
  /electoral/identity:
    get:
      tags: [Access]
      operationId: getElectoralIdentity
      summary: Reconcilia e retorna as participações do parlamentar titular.
      responses:
        '200':
          description: Contexto eleitoral próprio, compartilhado com assessores delegados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralIdentity' }
  /electoral/identity/reconcile:
    post:
      tags: [Access]
      operationId: reconcileElectoralIdentity
      summary: Reexecuta a vinculação automática pelo CPF protegido e pelo cadastro oficial sincronizado.
      responses:
        '200':
          description: Estado da reconciliação sem exposição do CPF.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralIdentityReconciliation' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /electoral/identity/candidacies:
    post:
      tags: [Access]
      operationId: confirmElectoralCandidacy
      summary: Confirma manualmente uma candidatura somente como contingência.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidacy_id]
              properties:
                candidacy_id: { type: string, format: uuid }
      responses:
        '200':
          description: A candidatura já estava elegível e foi reconciliada automaticamente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralIdentityCandidacy' }
        '201':
          description: Participação confirmada manualmente por CPF ausente, fonte indisponível ou divergência.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralIdentityCandidacy' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A candidatura já foi vinculada automaticamente pelo CPF oficial. }
        '404': { description: Candidatura publicada não encontrada. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/identity/candidacies/{candidacy_id}:
    delete:
      tags: [Access]
      operationId: removeElectoralCandidacy
      summary: Remove uma confirmação manual; vínculos automáticos exigem correção ou revisão.
      parameters:
        - name: candidacy_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Participação removida. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Vínculo automático não pode ser removido manualmente. }
        '404': { description: Participação confirmada não encontrada. }
  /electoral/offices:
    get:
      tags: [Elections]
      operationId: listElectoralOffices
      responses:
        '200':
          description: Cargos presentes em versões publicadas.
  /electoral/datasets:
    get:
      tags: [Elections]
      operationId: listElectoralDatasetVersions
      responses:
        '200':
          description: Proveniência das versões publicadas e substituídas.
  /electoral/coverage:
    get:
      tags: [Elections]
      operationId: getElectoralCoverage
      parameters:
        - name: uf
          in: query
          schema: { type: string, pattern: '^[A-Za-z]{2}$' }
      responses:
        '200':
          description: Matriz histórica 2012–2024, distinguindo ciclos completos, parciais e ausentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralCoverage' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/quality:
    get:
      tags: [Elections]
      operationId: getElectoralQuality
      responses:
        '200':
          description: Manifestos e indicadores de qualidade das cargas publicadas.
  /electoral/coverage-profile:
    get:
      tags: [Mandate Intelligence]
      operationId: getElectoralCoverageProfile
      summary: Retorna a versão ativa da fórmula e dos pesos do ICT.
      responses:
        '200':
          description: Perfil ativo do ICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageProfile' }
    post:
      tags: [Mandate Intelligence]
      operationId: versionElectoralCoverageProfile
      summary: Cria uma nova versão do perfil; operação exclusiva do parlamentar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoverageProfileInput' }
      responses:
        '201':
          description: Nova versão ativada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageProfile' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /electoral/mandate-snapshots:
    get:
      tags: [Mandate Intelligence]
      operationId: listElectoralMandateSnapshots
      responses:
        '200': { description: Snapshots privados do mandato, do mais recente ao mais antigo. }
    post:
      tags: [Mandate Intelligence]
      operationId: createElectoralMandateSnapshot
      summary: Materializa briefing agregado, reproduzível e sujeito ao limiar de privacidade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period_start, period_end]
              properties:
                period_start: { type: string, format: date }
                period_end: { type: string, format: date }
                election_id: { type: string, format: uuid }
                candidate_id: { type: string, format: uuid }
      responses:
        '201':
          description: Snapshot imutável criado e auditado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MandateSnapshot' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/territory-links:
    get:
      tags: [Mandate Intelligence]
      operationId: listElectoralTerritoryLinks
      summary: Lista o crosswalk revisado e as unidades disponíveis para uma eleição.
      parameters:
        - name: election_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Territórios operacionais, unidades eleitorais e vínculos ativos. }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Mandate Intelligence]
      operationId: createElectoralTerritoryLink
      summary: Registra ou reativa um vínculo territorial sujeito a revisão humana.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ElectoralTerritoryLinkInput' }
      responses:
        '201': { description: Vínculo revisado registrado. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/territory-links/{link_id}:
    delete:
      tags: [Mandate Intelligence]
      operationId: deactivateElectoralTerritoryLink
      parameters:
        - name: link_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Vínculo desativado sem alterar snapshots históricos. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Vínculo não encontrado. }
  /electoral/mandate-snapshots/{snapshot_id}:
    get:
      tags: [Mandate Intelligence]
      operationId: getElectoralMandateSnapshot
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Snapshot privado do mesmo tenant e mandato.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MandateSnapshot' }
        '404': { description: Snapshot não encontrado no escopo autorizado. }
  /electoral/public-commitments:
    get:
      tags: [Mandate Intelligence]
      operationId: listPublicCommitments
      summary: Lista compromissos públicos do mandato por território e estado efetivo.
      responses:
        '200': { description: Compromissos, territórios e responsáveis elegíveis. }
    post:
      tags: [Mandate Intelligence]
      operationId: createPublicCommitment
      summary: Cadastra compromisso; operação exclusiva do parlamentar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicCommitmentInput' }
      responses:
        '201':
          description: Compromisso criado com evento imutável de histórico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicCommitment' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/public-commitments/{commitment_id}:
    get:
      tags: [Mandate Intelligence]
      operationId: getPublicCommitment
      parameters:
        - $ref: '#/components/parameters/CommitmentId'
      responses:
        '200':
          description: Compromisso com evidências e histórico.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicCommitment' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Mandate Intelligence]
      operationId: updatePublicCommitment
      parameters:
        - $ref: '#/components/parameters/CommitmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicCommitmentUpdateInput' }
      responses:
        '200': { description: Compromisso atualizado e nova versão registrada no histórico. }
        '404': { $ref: '#/components/responses/NotFound' }
  /electoral/public-commitments/{commitment_id}/evidence:
    post:
      tags: [Mandate Intelligence]
      operationId: addPublicCommitmentEvidence
      parameters:
        - $ref: '#/components/parameters/CommitmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicCommitmentEvidenceInput' }
      responses:
        '201': { description: Evidência pública adicionada sem alterar eventos anteriores. }
        '404': { $ref: '#/components/responses/NotFound' }
  /electoral/operational-map:
    get:
      tags: [Mandate Intelligence]
      operationId: getElectoralOperationalMap
      summary: Retorna limite oficial da jurisdição e pontos públicos dos compromissos.
      responses:
        '200':
          description: Camada operacional; não cria polígonos para territórios sem malha oficial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationalMap' }
  /electoral/candidates:
    get:
      tags: [Candidates]
      operationId: searchCandidates
      parameters:
        - name: election_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 120 }
        - name: party
          in: query
          schema: { type: string }
        - name: office
          in: query
          schema: { type: string }
        - name: explore
          in: query
          description: Permite busca somente leitura no catálogo público fora do contexto operacional.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Candidatos encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidatePage'
  /electoral/candidates/{candidate_id}/results:
    get:
      tags: [Candidates]
      operationId: getCandidateResults
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/ElectionId'
        - $ref: '#/components/parameters/TerritoryLevel'
        - name: parent_territory_id
          in: query
          schema: { type: string, format: uuid }
        - name: municipalityCode
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [name, votes, share, rank], default: votes }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Resultado territorial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultSet'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /electoral/candidates/{candidate_id}/history:
    get:
      tags: [Analytics]
      operationId: getCandidateHistory
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - name: municipalityCode
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Candidaturas publicadas associadas à mesma pessoa e avisos de comparabilidade.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateHistory'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /electoral/candidates/{candidate_id}/map:
    get:
      tags: [Analytics]
      operationId: getCandidateMap
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/ElectionId'
        - $ref: '#/components/parameters/TerritoryLevel'
        - name: municipalityCode
          in: query
          schema: { type: string }
      responses:
        '200':
          description: FeatureCollection oficial ou aviso explícito de geometria indisponível.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralMap' }
        '404': { $ref: '#/components/responses/NotFound' }
  /electoral/candidates/{candidate_id}/identity-review:
    put:
      tags: [Analytics]
      operationId: reviewCandidateIdentity
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityReviewRequest' }
      responses:
        '200': { description: Vínculos privados revisados pelo usuário. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/comparisons:
    post:
      tags: [Analytics]
      operationId: createComparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComparisonRequest'
      responses:
        '200':
          description: Comparativo calculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comparison'
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/favorites:
    get:
      tags: [Analytics]
      operationId: listElectoralFavorites
      responses:
        '200': { description: Favoritos privados do usuário autenticado. }
    post:
      tags: [Analytics]
      operationId: saveElectoralFavorite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavoriteInput' }
      responses:
        '201': { description: Favorito salvo. }
        '200': { description: Favorito existente atualizado de forma idempotente. }
  /electoral/favorites/{favorite_id}:
    delete:
      tags: [Analytics]
      operationId: deleteElectoralFavorite
      parameters:
        - name: favorite_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Favorito excluído. }
        '404': { description: Favorito inexistente ou pertencente a outro usuário. }
  /electoral/saved-comparisons:
    get:
      tags: [Analytics]
      operationId: listSavedElectoralComparisons
      responses:
        '200': { description: Comparações privadas do usuário autenticado. }
    post:
      tags: [Analytics]
      operationId: saveElectoralComparison
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedComparisonInput' }
      responses:
        '201': { description: Comparação validada e salva. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/saved-comparisons/{comparison_id}:
    delete:
      tags: [Analytics]
      operationId: deleteSavedElectoralComparison
      parameters:
        - name: comparison_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Comparação excluída. }
        '404': { description: Comparação inexistente ou pertencente a outro usuário. }
  /electoral/territories/{territory_id}/mandate-overlay:
    get:
      tags: [Analytics]
      operationId: getMandateOverlay
      parameters:
        - name: territory_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: snapshot_id
          in: query
          description: Seleciona explicitamente um snapshot reproduzível.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Indicadores agregados do mandato.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MandateOverlay'
        '404': { description: Snapshot ou território não encontrado no tenant. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/territories/{territory_id}/briefing:
    get:
      tags: [Analytics]
      operationId: getTerritoryBriefing
      parameters:
        - name: territory_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: snapshot_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Briefing agregado, marcado como rascunho para revisão humana.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerritoryBriefing' }
        '404': { description: Snapshot ou território não encontrado no tenant. }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/alert-preferences:
    get:
      tags: [Analytics]
      operationId: getElectoralAlertPreferences
      responses:
        '200':
          description: Preferências individuais de alertas territoriais.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralAlertPreference' }
    put:
      tags: [Analytics]
      operationId: updateElectoralAlertPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ElectoralAlertPreferenceInput' }
      responses:
        '200':
          description: Preferências atualizadas e auditadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralAlertPreference' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/alerts:
    get:
      tags: [Analytics]
      operationId: listElectoralAlerts
      responses:
        '200':
          description: Alertas estruturados do snapshot mais recente, filtrados pelo usuário.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralAlertFeed' }
  /electoral/alert-deliveries:
    get:
      tags: [Analytics]
      operationId: listElectoralAlertDeliveries
      summary: Histórico individual de alertas efetivamente entregues ou enfileirados.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200': { description: Entregas no GabFlow e por e-mail, com estado auditável. }
  /electoral/insights:
    get:
      tags: [Analytics]
      operationId: listInsights
      parameters:
        - $ref: '#/components/parameters/Page'
        - in: query
          name: perPage
          schema: { type: integer, minimum: 5, maximum: 25, default: 10 }
        - in: query
          name: type
          schema: { type: string, enum: [candidate, comparison, question] }
        - in: query
          name: status
          schema: { type: string, enum: [QUEUED, PROCESSING, COMPLETED, FAILED, REFUSED, HIDDEN] }
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Historico paginado de insights visiveis ao ator autorizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralInsightPage' }
    post:
      tags: [Analytics]
      operationId: requestInsight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsightRequest'
      responses:
        '200':
          description: Pergunta recusada imediatamente pela política eleitoral, sem enfileiramento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralInsight' }
        '202':
          description: Insight em processamento.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralInsight' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /electoral/insights/review-queue:
    get:
      tags: [Analytics]
      operationId: listInsightReviewQueue
      responses:
        '200': { description: Insights pendentes de decisão do parlamentar. }
        '403': { $ref: '#/components/responses/Forbidden' }
  /electoral/insights/{insightId}:
    parameters:
      - in: path
        name: insightId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Analytics]
      operationId: getInsight
      responses:
        '200':
          description: Insight estruturado e auditÃ¡vel.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralInsight' }
        '404': { $ref: '#/components/responses/NotFound' }
  /electoral/insights/{insightId}/feedback:
    parameters:
      - in: path
        name: insightId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Analytics]
      operationId: createInsightFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsightFeedbackInput' }
      responses:
        '201': { description: Feedback registrado com a versÃ£o do modelo. }
        '404': { $ref: '#/components/responses/NotFound' }
  /electoral/insights/{insightId}/review:
    parameters:
      - in: path
        name: insightId
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Analytics]
      operationId: reviewElectoralInsight
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InsightReviewInput' }
      responses:
        '200':
          description: Decisão humana registrada com hash dos fatos e versão do modelo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElectoralInsight' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /electoral/scenarios:
    get:
      tags: [Scenarios]
      operationId: listScenarios
      responses:
        '200': { description: CenÃ¡rios visÃ­veis ao ator autorizado. }
